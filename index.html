<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hệ Thống Đặt Đơn Hộ & Tra Cứu Vận Đơn - ma100.xyz</title>

  <!-- Tối ưu tốc độ: Bắt tay DNS & SSL với các máy chủ -->
  <link rel="preconnect" href="https://script.google.com" crossorigin>
  <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin>
  <link rel="preconnect" href="https://dinhkienldr.github.io" crossorigin>
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="dns-prefetch" href="https://dinhkienldr.github.io">

  <!-- Favicon -->
  <link rel="icon" href="https://deo.shopeemobile.com/chem/desktop/vi/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #ee4d2d;
      --nav-height: 195px;
      --bg-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-color);
    }

    /* ============================================================
       THANH ĐIỀU HƯỚNG VÀ TIÊU ĐỀ NẰM TRÊN CÙNG
       ============================================================ */
    .top-nav-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--nav-height);
      background: #ffffff !important;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
      border-bottom: 1.5px solid #edf2f7;
      z-index: 999999;
      padding: 12px 14px 14px;
    }

    /* TIÊU ĐỀ THƯƠNG HIỆU */
    .brand-header {
      text-align: center;
      margin-bottom: 10px;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 6px;
    }

    .brand-logo-badge {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, #ff6536 0%, #ee4d2d 100%);
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.32);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 20px;
      transition: all 0.25s ease;
    }

    .brand-title {
      font-size: 18px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 3px;
      letter-spacing: -0.3px;
      line-height: 1.25;
    }

    .brand-subtitle {
      font-size: 13.5px;
      color: #ee4d2d;
      font-weight: 700;
      line-height: 1.3;
    }

    /* HỘP 2 NÚT TAB NẰM NGAY DƯỚI DÒNG: Giảm 100k cho đơn hàng từ 0đ */
    .nav-pill-box {
      width: 100%;
      max-width: 460px;
      height: 44px;
      background: #f1f5f9;
      border-radius: 24px;
      display: flex;
      padding: 3px;
      position: relative;
      border: 1px solid #e2e8f0;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.03);
    }

    .nav-tab-btn {
      flex: 1;
      height: 100%;
      border: none;
      background: transparent;
      color: #64748b;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 20px;
      position: relative;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.2px;
      user-select: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .nav-tab-btn * {
      pointer-events: none;
    }

    .nav-tab-btn i {
      font-size: 15px;
      transition: transform 0.2s;
    }

    /* KHI TAB ĐƯỢC CHỌN (ACTIVE) */
    .nav-tab-btn.active {
      background: linear-gradient(135deg, #ee4d2d, #ff5722);
      color: #ffffff !important;
      box-shadow: 0 4px 12px rgba(238, 77, 45, 0.35);
    }

    .nav-tab-btn.active i {
      transform: scale(1.1);
      color: #ffffff !important;
    }

    /* KHI CHƯA CHỌN (HOVER) */
    .nav-tab-btn:not(.active):hover {
      color: #1e293b;
      background: #e2e8f0;
    }

    /* ============================================================
       HIỆU ỨNG ĐỘNG CHO 2 TAB ĐỂ THU HÚT SỰ CHÚ Ý CỦA KHÁCH
       ============================================================ */
    .truck-icon-anim {
      display: inline-block;
      animation: driveTruck 2.2s infinite ease-in-out;
      color: #2563eb;
    }

    @keyframes driveTruck {
      0%, 100% { transform: translateY(0); }
      20% { transform: translateY(-3px) rotate(-3deg); }
      40% { transform: translateY(1px) rotate(1deg); }
      60% { transform: translateY(-2px); }
      80% { transform: translateY(0); }
    }

    .cart-bounce-anim {
      display: inline-block;
      animation: cartWiggle 1.8s infinite ease-in-out;
      color: #ee4d2d !important;
    }

    @keyframes cartWiggle {
      0%, 100% { transform: rotate(0deg) scale(1); }
      15% { transform: rotate(-12deg) scale(1.18); }
      30% { transform: rotate(10deg) scale(1.18); }
      45% { transform: rotate(-8deg); }
      60% { transform: rotate(4deg); }
      75% { transform: rotate(0deg); }
    }

    /* Badge phát sáng nhấp nháy (HOT / GIẢM 100K) */
    .badge-pulse {
      position: absolute;
      top: -6px;
      right: 8px;
      color: #ffffff;
      font-size: 9px;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 10px;
      letter-spacing: 0.5px;
      animation: pulseGlow 1.8s infinite;
      pointer-events: none;
    }

    .badge-tracking {
      background: #2563eb;
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.45);
    }

    .badge-order {
      background: #ee4d2d;
      box-shadow: 0 2px 6px rgba(238, 77, 45, 0.45);
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 77, 45, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 7px rgba(238, 77, 45, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(238, 77, 45, 0); }
    }

    /* ============================================================
       KHUNG HIỂN THỊ NỘI DUNG (GIỮ TRẠNG THÁI TRONG BỘ NHỚ CHO MOBILE)
       ============================================================ */
    .app-viewport {
      position: fixed;
      top: var(--nav-height);
      left: 0;
      width: 100%;
      height: calc(100% - var(--nav-height));
      overflow: hidden;
      background: #f8fafc;
    }

    .app-frame-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
      background: #f8fafc;
      transition: opacity 0.15s ease;
    }

    .app-frame-wrap.active {
      visibility: visible;
      opacity: 1;
      pointer-events: auto;
      z-index: 2;
    }

    /* Ẩn tiêu đề trùng lặp bên trong web con và tạo khoảng cách thoáng đãng */
    #wrap-order iframe {
      margin-top: -155px;
      height: calc(100% + 155px);
    }

    #wrap-tracking iframe {
      margin-top: -210px;
      height: calc(100% + 210px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #f8fafc;
    }

    /* MÀN HÌNH CHỜ BAN ĐẦU */
    #page-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.3s ease, visibility 0.3s ease;
    }

    #page-loader.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-icon {
      width: 62px;
      height: 62px;
      border-radius: 18px;
      background: linear-gradient(135deg, #ee4d2d, #ff6842);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 28px;
      box-shadow: 0 10px 25px rgba(238, 77, 45, 0.3);
      animation: pulse 1.5s infinite ease-in-out;
    }

    .loader-title {
      margin-top: 15px;
      font-size: 16px;
      font-weight: 700;
      color: #0f172a;
    }

    .loader-sub {
      margin-top: 5px;
      font-size: 13px;
      color: #64748b;
    }

    .loader-bar-wrap {
      width: 140px;
      height: 4px;
      background: #e2e8f0;
      border-radius: 10px;
      margin-top: 16px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: #ee4d2d;
      border-radius: 10px;
      animation: loading 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes loading {
      0% { left: -40%; width: 40%; }
      50% { left: 30%; width: 60%; }
      100% { left: 100%; width: 40%; }
    }

    @media (max-width: 480px) {
      :root {
        --nav-height: 188px;
      }
      .brand-title {
        font-size: 17px;
      }
      .brand-subtitle {
        font-size: 13px;
      }
      .nav-tab-btn {
        font-size: 12.5px;
        gap: 5px;
      }
    }
  </style>
</head>
<body>

  <div id="page-loader">
    <div class="loader-icon">🛍️</div>
    <div class="loader-title">Hệ Thống Dịch Vụ Shopee</div>
    <div class="loader-sub">Đang khởi tạo kết nối...</div>
    <div class="loader-bar-wrap">
      <div class="loader-bar"></div>
    </div>
  </div>

  <!-- THANH ĐIỀU HƯỚNG VÀ TIÊU ĐỀ NẰM TRÊN CÙNG -->
  <header class="top-nav-bar">
    <!-- Phần tiêu đề thương hiệu -->
    <div class="brand-header">
      <div class="brand-logo-wrap">
        <div class="brand-logo-badge" id="main-brand-badge">
          <i class="fa-solid fa-truck-fast"></i>
        </div>
      </div>
      <h1 class="brand-title" id="main-brand-title">Hệ Thống Đặt Đơn Hộ Shopee</h1>
      <p class="brand-subtitle" id="main-brand-subtitle">Giảm 100k cho đơn hàng từ 0đ</p>
    </div>

    <!-- 2 MỤC NẰM NGAY DƯỚI DÒNG: Giảm 100k cho đơn hàng từ 0đ -->
    <div class="nav-pill-box">
      <!-- 1. Nút Đặt Hộ Đơn -->
      <button class="nav-tab-btn active" id="tab-order" onclick="switchTab('order')">
        <i class="fa-solid fa-cart-shopping" id="cart-icon"></i>
        <span>ĐẶT HỘ ĐƠN</span>
        <span class="badge-pulse badge-order" id="badge-order" style="display: none;">GIẢM 100K</span>
      </button>

      <!-- 2. Nút Tra Cứu Đơn Hàng -->
      <button class="nav-tab-btn" id="tab-tracking" onclick="switchTab('tracking')">
        <i class="fa-solid fa-truck-fast truck-icon-anim" id="truck-icon"></i>
        <span>TRA CỨU ĐƠN HÀNG</span>
        <span class="badge-pulse badge-tracking" id="badge-tracking">HOT</span>
      </button>
    </div>
  </header>

  <!-- KHUNG HIỂN THỊ CÁC WEB APP -->
  <main class="app-viewport">
    <!-- 1. Web App Đặt Đơn Mặc Định -->
    <div class="app-frame-wrap active" id="wrap-order">
      <iframe 
        id="frame-order"
        src="https://script.google.com/macros/s/AKfycbx5dYh2nejqU5YDwvDGxzmutTai0NPg7B55Bn9U2yOC7Q4RqHL9WH8tICrqI-3-RdIi/exec" 
        allow="clipboard-write; clipboard-read"
        loading="eager"
        onload="hideLoader()">
      </iframe>
    </div>

    <!-- 2. Web App Tra Cứu Đơn Hàng (Chạy trực tiếp từ Google Apps Script) -->
    <div class="app-frame-wrap" id="wrap-tracking">
      <iframe 
        id="frame-tracking"
        src="https://script.google.com/macros/s/AKfycbzPi0dI6GMkcRrEsyJ8aqlCmSKkXW3X7Z-GEJQlfxNUTeH5dwFDc36vqOrb2C9TZ08e/exec" 
        allow="clipboard-write; clipboard-read"
        loading="eager">
      </iframe>
    </div>
  </main>

  <script>
    function hideLoader() {
      const loader = document.getElementById('page-loader');
      if (loader) {
        loader.classList.add('hidden');
        setTimeout(() => { loader.style.display = 'none'; }, 350);
      }
    }
    setTimeout(hideLoader, 5000);

    // Chuyển đổi tab thông minh với hiệu ứng động qua lại
    function switchTab(tabName) {
      const tabOrder = document.getElementById('tab-order');
      const tabTracking = document.getElementById('tab-tracking');
      const wrapOrder = document.getElementById('wrap-order');
      const wrapTracking = document.getElementById('wrap-tracking');
      const cartIcon = document.getElementById('cart-icon');
      const truckIcon = document.getElementById('truck-icon');
      const badgeOrder = document.getElementById('badge-order');
      const badgeTracking = document.getElementById('badge-tracking');

      const brandTitle = document.getElementById('main-brand-title');
      const brandSubtitle = document.getElementById('main-brand-subtitle');
      const brandBadge = document.getElementById('main-brand-badge');

      if (tabName === 'order') {
        // Active Đặt Hộ Đơn
        tabOrder.classList.add('active');
        tabTracking.classList.remove('active');
        wrapOrder.classList.add('active');
        wrapTracking.classList.remove('active');

        // Bật hiệu ứng động bên Tra Cứu, tắt bên Đặt Đơn
        cartIcon.classList.remove('cart-bounce-anim');
        badgeOrder.style.display = 'none';

        truckIcon.classList.add('truck-icon-anim');
        badgeTracking.style.display = 'inline-block';

        // Cập nhật tiêu đề Tab Đặt Hộ Đơn
        if (brandTitle) brandTitle.innerText = "Hệ Thống Đặt Đơn Hộ Shopee";
        if (brandSubtitle) {
          brandSubtitle.innerText = "Giảm 100k cho đơn hàng từ 0đ";
          brandSubtitle.style.color = "#ee4d2d";
        }
        if (brandBadge) {
          brandBadge.innerHTML = '<i class="fa-solid fa-truck-fast"></i>';
          brandBadge.style.background = "linear-gradient(135deg, #ff6536 0%, #ee4d2d 100%)";
          brandBadge.style.boxShadow = "0 4px 12px rgba(238, 77, 45, 0.32)";
        }
      } else if (tabName === 'tracking') {
        // Active Tra Cứu Đơn Hàng
        tabTracking.classList.add('active');
        tabOrder.classList.remove('active');
        wrapTracking.classList.add('active');
        wrapOrder.classList.remove('active');

        // BẬT HIỆU ỨNG ĐỘNG THU HÚT BÊN ĐẶT ĐƠN HỘ (Giỏ hàng rung rinh + Badge GIẢM 100K)
        truckIcon.classList.remove('truck-icon-anim');
        badgeTracking.style.display = 'none';

        cartIcon.classList.add('cart-bounce-anim');
        badgeOrder.style.display = 'inline-block';

        // Cập nhật tiêu đề Tab Tra Cứu
        if (brandTitle) brandTitle.innerText = "Tra Cứu Đơn Hàng";
        if (brandSubtitle) {
          brandSubtitle.innerText = "Theo dõi hành trình theo số điện thoại Zalo";
          brandSubtitle.style.color = "#2563eb";
        }
        if (brandBadge) {
          brandBadge.innerHTML = '<i class="fa-solid fa-box-open"></i>';
          brandBadge.style.background = "linear-gradient(135deg, #2563eb 0%, #3b82f6 100%)";
          brandBadge.style.boxShadow = "0 4px 12px rgba(37, 99, 235, 0.32)";
        }
      }
    }

    // Hỗ trợ cảm ứng chạm tức thì (Zero-delay) trên màn hình điện thoại
    ['tab-order', 'tab-tracking'].forEach(function(id) {
      const el = document.getElementById(id);
      if (el) {
        el.addEventListener('touchend', function(e) {
          e.preventDefault();
          switchTab(id === 'tab-order' ? 'order' : 'tracking');
        }, { passive: false });
      }
    });

    // Lắng nghe sự kiện chuyển tab từ web con (khi khách bấm nút ĐẶT ĐƠN HỘ)
    window.addEventListener('message', function(event) {
      if (event.data && event.data.action === 'switchTab') {
        switchTab(event.data.tab);
      }
    });
  </script>
</body>
</html>
